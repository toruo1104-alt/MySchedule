<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>MySchedule</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2f4a6b">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
</head>
<body>
  <div id="app">

    <!-- ===== ツールバー ===== -->
    <header id="toolbar">
      <div class="tb-nav">
        <button type="button" id="btn-prev" title="前月">◀</button>
        <span id="ym-label">----年--月</span>
        <button type="button" id="btn-next" title="次月">▶</button>
        <button type="button" id="btn-today">今日</button>
        <button type="button" id="btn-undo" title="元に戻す (Ctrl+Z)" disabled>↶ 元に戻す</button>
        <button type="button" id="btn-toggle-palette" title="区分パレットの表示/非表示">≡ 区分</button>
        <span class="tb-view-switch">
          <button type="button" id="btn-view-month" class="tb-view-btn" title="月ビュー">月</button>
          <button type="button" id="btn-view-week" class="tb-view-btn" title="週ビュー(読み取り専用)">週</button>
        </span>
      </div>

      <!-- 区分パレット(JSで生成: 区分ボタン+消しゴム) -->
      <div id="palette" class="tb-palette"></div>

      <div class="tb-actions">
        <span id="save-status" class="is-saved" title="保存状態">保存済み</span>
        <div class="tb-more-wrap">
          <button type="button" id="btn-more" title="その他の操作(区分編集・取込・設定)">⋯</button>
          <div id="more-menu" class="tb-more-menu" hidden>
            <button type="button" id="btn-categories">区分編集</button>
            <button type="button" id="btn-import" title="Googleカレンダーの予定を取り込む">取込</button>
            <button type="button" id="btn-settings" title="API設定">⚙ 設定</button>
          </div>
        </div>
      </div>
    </header>

    <!-- ===== 月グリッド ===== -->
    <main>
      <div id="grid-container">
        <div id="grid-loading" hidden>読み込み中…</div>
        <table id="grid"></table>
      </div>

      <!-- ===== 集計パネル ===== -->
      <section id="summary">
        <div id="summary-categories" class="sum-block"></div>
        <div id="summary-work" class="sum-block"></div>
      </section>

      <!-- ===== 週ビュー(読み取り専用) ===== -->
      <div id="week-view" hidden>
        <div id="week-header">
          <button type="button" id="btn-week-reload" title="キャッシュを破棄して再取得">⟳ 再読込</button>
        </div>
        <div id="week-container">
          <div id="week-loading" hidden>読み込み中…</div>
          <div id="week-grid"></div>
        </div>
        <div id="week-tasks-note" class="modal-note" hidden>タスク連携は未設定です(GASでGoogle Tasksの高度なサービスを有効にすると表示されます)</div>
      </div>
    </main>

  </div>

  <!-- セルメモ・日情報のポップオーバー(位置・中身はJSが設定) -->
  <div id="popover" hidden></div>

  <!-- モーダル(区分編集・API設定など) -->
  <div id="modal-overlay" hidden>
    <div id="modal" role="dialog"></div>
  </div>

  <div id="toast" hidden></div>

  <script src="app.js"></script>
  <script>
    // PWA(ホーム画面インストール): https/localhostのみ登録し、失敗しても致命的でないため握りつぶす
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      navigator.serviceWorker.register("sw.js").catch(function () { /* 未登録でもアプリ動作には影響しない */ });
    }
  </script>
</body>
</html>
